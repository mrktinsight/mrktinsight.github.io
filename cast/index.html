<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Being Grateful</title>
    <!-- No protocol: the framework is fetched over whatever protocol serves this
         page, which GitHub Pages forces to https. -->
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <link rel="stylesheet" href="receiver.css">
  </head>
  <body>
    <!-- The whole player UI. Everything visual is driven by CSS custom
         properties in receiver.css - see
         https://developers.google.com/cast/docs/web_receiver/customize_ui -->
    <cast-media-player></cast-media-player>

    <script>
      // Media3's CastPlayer sends fully-formed MediaInfo (content URL, MIME type,
      // MUSIC_TRACK metadata and artwork), so no interception is needed here.
      cast.framework.CastReceiverContext.getInstance().start();

      // Hide the duplicate album-art card when a track has no real artwork.
      //
      // The sender substitutes a hosted rose (cast-art-1024.jpg) for tracks
      // without community artwork. CAF's TV audio layout then renders that same
      // image twice: full-bleed in the background slideshow AND as the
      // top-right album-art card (#castMetadataImage inside tv-overlay). The
      // background is wanted; the corner duplicate is not. Community artwork
      // must keep showing in the card, so this is conditional on the URL, which
      // rules out plain CSS - and the card lives two OPEN shadow roots deep
      // (cast-media-player > tv-overlay), which rules out receiver.css anyway.
      //
      // Uses undocumented framework internals, so it degrades gracefully: if a
      // framework update renames these nodes, the card simply shows again.
      (function () {
        var FALLBACK_MARKER = 'cast-art-1024';

        // TEMPORARY diagnostic readout, remove once verified on hardware.
        var diag = document.createElement('div');
        diag.style.cssText = 'position:fixed;left:16px;top:8px;' +
          'z-index:2147483647;font:22px monospace;color:#E8B931;' +
          'background:rgba(10,22,40,0.9);padding:4px 10px;max-width:92vw;' +
          'white-space:pre-wrap;word-break:break-all;pointer-events:none;';

        // Collect the album-art card(s), piercing every open shadow root.
        // On this device generation the audio playback UI renders the artwork
        // twice: div.bg-image full-bleed (wanted) and div.album.art as a
        // corner card (the duplicate). Android TV runtimes use tv-overlay >
        // #castMetadataImage instead, so match both shapes.
        function collectCards(root, out, depth) {
          if (depth > 8) return;
          var all = root.querySelectorAll('*');
          for (var i = 0; i < all.length; i++) {
            var el = all[i];
            var cl = el.classList;
            if ((cl && cl.contains('album') && cl.contains('art')) ||
                el.id === 'castMetadataImage') {
              out.push(el);
            }
            if (el.shadowRoot) collectCards(el.shadowRoot, out, depth + 1);
          }
        }

        setInterval(function () {
          var status = ['v6'];
          var player = document.querySelector('cast-media-player');
          var psr = player && player.shadowRoot;

          // Keep the readout on top of whatever UI the runtime builds.
          var mount = psr || document.body;
          if (diag.parentNode !== mount) mount.appendChild(diag);

          var cards = [];
          collectCards(document, cards, 0);
          var hidden = 0;
          for (var i = 0; i < cards.length; i++) {
            var card = cards[i];
            var bg = (card.style.backgroundImage || '') + '|' +
              (getComputedStyle(card).backgroundImage || '') + '|' +
              (card.src || '');
            var isFallback = bg.indexOf(FALLBACK_MARKER) !== -1;
            // visibility (not display) so the layout doesn't reflow; cleared
            // again when a track with real artwork comes up.
            card.style.visibility = isFallback ? 'hidden' : '';
            if (isFallback) hidden++;
          }
          status.push('cards:' + cards.length + ' hidden:' + hidden);
          diag.textContent = status.join('  ');
        }, 1000);
      })();
    </script>
  </body>
</html>
