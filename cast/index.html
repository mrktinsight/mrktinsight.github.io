<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Being Grateful</title>
    <!-- No protocol: the framework is fetched over whatever protocol serves this
         page, which GitHub Pages forces to https. -->
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <link rel="stylesheet" href="receiver.css">
  </head>
  <body>
    <!-- The whole player UI. Everything visual is driven by CSS custom
         properties in receiver.css - see
         https://developers.google.com/cast/docs/web_receiver/customize_ui -->
    <cast-media-player></cast-media-player>

    <script>
      // Media3's CastPlayer sends fully-formed MediaInfo (content URL, MIME type,
      // MUSIC_TRACK metadata and artwork), so no interception is needed here.
      cast.framework.CastReceiverContext.getInstance().start();

      // Hide the small album-art card unconditionally.
      //
      // The audio playback UI renders the track artwork twice: full-bleed as
      // the background (wanted) and again as a small corner card. The sender
      // sends the branded rose for every track, so the card is always a
      // duplicate of the background. The card nodes live inside open shadow
      // roots, out of reach of receiver.css, so a style is injected into each
      // root as soon as it exists - before the card is ever painted, so
      // nothing flashes. A conditional show-community-artwork version of this
      // was tried and rejected: revealing the card raced the artwork load and
      // flashed it at every track change.
      //
      // Verified on hardware 2026-08-24 (Vizio, Chromecast built-in): the
      // card there is div.album-art. Android TV runtimes render
      // tv-overlay > #castMetadataImage instead; both are covered. Uses
      // undocumented framework internals, so it degrades gracefully: if a
      // framework update renames these nodes, the card simply shows again.
      (function () {
        var STYLE_ID = 'bg-hide-art-card';
        var CARD_SELECTOR = '.album-art, .metadataImage, #castMetadataImage';
        var CSS = CARD_SELECTOR + ' { visibility: hidden !important; }';

        // Walk the whole tree, piercing every open shadow root: inline-hide
        // any card element found (the mechanism verified on hardware), and
        // drop a stylesheet into each shadow root along the way so cards
        // created later in that root never paint at all.
        function sweep(root, depth) {
          if (!root || depth > 8) return;
          if (root.nodeType === 11 && !root.getElementById(STYLE_ID)) {
            var style = document.createElement('style');
            style.id = STYLE_ID;
            style.textContent = CSS;
            root.appendChild(style);
          }
          var all = root.querySelectorAll('*');
          for (var i = 0; i < all.length; i++) {
            var el = all[i];
            if (el.matches && el.matches(CARD_SELECTOR)) {
              el.style.setProperty('visibility', 'hidden', 'important');
            }
            if (el.shadowRoot) sweep(el.shadowRoot, depth + 1);
          }
        }
        setInterval(function () { sweep(document, 0); }, 250);
      })();
    </script>
  </body>
</html>
