<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Being Grateful</title>
    <!-- No protocol: the framework is fetched over whatever protocol serves this
         page, which GitHub Pages forces to https. -->
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <link rel="stylesheet" href="receiver.css">
  </head>
  <body>
    <!-- The whole player UI. Everything visual is driven by CSS custom
         properties in receiver.css - see
         https://developers.google.com/cast/docs/web_receiver/customize_ui -->
    <cast-media-player></cast-media-player>

    <script>
      // Media3's CastPlayer sends fully-formed MediaInfo (content URL, MIME type,
      // MUSIC_TRACK metadata and artwork), so no interception is needed here.
      cast.framework.CastReceiverContext.getInstance().start();

      // Hide the duplicate album-art card when a track has no real artwork.
      //
      // The sender substitutes a hosted rose (cast-art-1024.jpg) for tracks
      // without community artwork. The audio playback UI renders that image
      // twice: full-bleed as the background (wanted) and again as a small
      // album-art card (the duplicate). Community artwork must keep showing
      // in the card, so this is conditional on the URL - which rules out
      // plain CSS - and the nodes live inside open shadow roots, which rules
      // out receiver.css anyway.
      //
      // Verified on hardware 2026-08-24 (Vizio, Chromecast built-in): the
      // card there is div.album-art (320px). Android TV runtimes render
      // tv-overlay > #castMetadataImage instead; both are handled, plus a
      // size-based fallback (background/splash/logo are viewport-wide, the
      // card is not) in case another runtime names it differently. Uses
      // undocumented framework internals, so it degrades gracefully: if a
      // framework update changes them, the card simply shows again.
      (function () {
        var FALLBACK_MARKER = 'cast-art-1024';
        var CARD_SELECTOR = '.album-art, #castMetadataImage, .metadataImage';

        // Known card nodes start hidden so the fallback rose never flashes;
        // the watcher reveals them as soon as real artwork is confirmed.
        var styleInjected = false;

        function paintsRose(el) {
          var bg = (el.style.backgroundImage || '') + '|' +
            (getComputedStyle(el).backgroundImage || '') + '|' + (el.src || '');
          return bg.indexOf(FALLBACK_MARKER) !== -1;
        }

        // Walk open shadow roots collecting card candidates: anything
        // matching the known selectors, plus any sub-fullscreen element
        // painting the rose.
        function collectCards(root, out, depth) {
          if (depth > 8) return;
          var all = root.querySelectorAll('*');
          for (var i = 0; i < all.length; i++) {
            var el = all[i];
            if (el.matches && el.matches(CARD_SELECTOR)) {
              out.push(el);
            } else if (paintsRose(el)) {
              var r = el.getBoundingClientRect();
              if (r.width > 0 && r.width < window.innerWidth * 0.8) out.push(el);
            }
            if (el.shadowRoot) collectCards(el.shadowRoot, out, depth + 1);
          }
        }

        setInterval(function () {
          var player = document.querySelector('cast-media-player');
          var psr = player && player.shadowRoot;
          if (psr && !styleInjected) {
            var style = document.createElement('style');
            style.textContent = '.album-art { visibility: hidden; }';
            psr.appendChild(style);
            styleInjected = true;
          }
          var cards = [];
          collectCards(document, cards, 0);
          for (var i = 0; i < cards.length; i++) {
            // 'visible' (not '') so revealing beats the injected default-hide.
            cards[i].style.visibility = paintsRose(cards[i]) ? 'hidden' : 'visible';
          }
        }, 250);
      })();
    </script>
  </body>
</html>
